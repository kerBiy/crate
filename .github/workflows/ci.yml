name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job's GITHUB_TOKEN can only read the repository.
permissions:
  contents: read

# A new push to a PR cancels its outdated run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sets JAVA_HOME to JDK 25, which the Gradle toolchain picks up (no foojay download).
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      # Caches ~/.gradle (written only from main) and validates the wrapper jar checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Compiles all modules and runs all tests; Testcontainers uses the runner's Docker.
      - name: Build and test
        run: ./gradlew build
