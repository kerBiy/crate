[versions]
spring-boot = "4.1.1"
# Boot 4.1 requires Spring Cloud 2025.1.2 or newer.
spring-cloud = "2025.1.3"
# Not in the Boot BOM. 3.x is the stable line (4.0 is still beta).
wiremock = "3.13.2"

[libraries]
# BOMs: they pin the versions of every Spring artifact below, so those have no version here.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }

# Boot 4 modular starter: brings spring-boot-starter-jdbc (HikariCP) + flyway-core.
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Flyway's Postgres support lives in its own module since Flyway 10.
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
# JdbcClient + HikariCP + transactions. The Flyway starter already brings it; declared where code uses it.
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
# JPA (Hibernate 7) for entities and repositories.
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
# Jakarta Bean Validation for request records.
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# Spring Security as libraries only (no filter chain): BCrypt, and JWT signing/verification via Nimbus JOSE.
# Versions come from spring-security-bom, which the Boot BOM imports.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
# Gateway: validates JWTs against a JWKS. Boot 4 name (spring-boot-starter-oauth2-resource-server is the deprecated alias).
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
# Spring for Apache Kafka 4 (Jackson 3 serializers: JacksonJsonSerializer/Deserializer).
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }

spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
# @ServiceConnection: Boot reads connection details straight from a Testcontainers container.
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# Testcontainers 2.x artifact names (versions from the Boot BOM).
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
# org.testcontainers.kafka.KafkaContainer (apache/kafka image); Boot gives it a @ServiceConnection.
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
# "Wait until this assertion passes": for results that arrive asynchronously, like consumed events.
awaitility = { module = "org.awaitility:awaitility" }
# In-process HTTP stub for tests. The standalone jar shades Jetty and Jackson 2, so nothing clashes.
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Used by build-logic to apply the Spring Boot plugin from a convention plugin.
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
