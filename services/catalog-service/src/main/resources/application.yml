spring:
  application:
    name: catalog-service
  kafka:
    # bootstrap-servers is set per profile (local: localhost:29092).
    consumer:
      # Consumers with the same group id split the topic's partitions between them, and the group
      # remembers (commits) how far it has read in each partition.
      group-id: catalog-service
      # With no committed offset yet (a brand-new group), start from the oldest message, not "only new ones".
      auto-offset-reset: earliest
      # The listener receives the raw JSON and dispatches on eventType itself (SPEC 6.3).
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit each record's offset right after the listener returns, i.e. after its DB transaction
      # committed. A crash in between means the record comes again: at-least-once, hence processed_events.
      ack-mode: record
      # Three consumer threads in the group, one per partition of review.events.
      concurrency: 3

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

crate:
  catalog:
    search:
      # Fallback when MusicBrainz is down: minimum pg_trgm word similarity (0-1).
      # 0.5 still matches a one-letter typo ("radiohed").
      match-threshold: 0.5
      cache-ttl: 7d
      # MusicBrainz's maximum. One request either way; more candidates for the popularity ranking.
      musicbrainz-limit: 100
      # Tuned with search-eval (ADR 010): 15 is the smallest weight that reached the best hit@3.
      popularity-weight: 15
      # Cover checks per cold search: the top of the ranking, as many as the largest page (limit=50).
      cover-check-count: 50
    cover-art:
      base-url: https://coverartarchive.org
      # HEAD requests in flight at once. 8 checks 50 albums in about 1.5 s.
      concurrency: 8
      timeout: 2s
      # A whole batch gives up after this; unanswered albums stay "unknown" and are shown.
      deadline: 3s
      recheck-after: 30d
  musicbrainz:
    base-url: https://musicbrainz.org/ws/2
    # MusicBrainz blocks clients without a meaningful User-Agent. The contact email lives in .env.
    # Required: startup fails without it.
    user-agent: Crate/0.1 ( ${MUSICBRAINZ_CONTACT} )
    connect-timeout: 2s
    # Searches can be slow on MusicBrainz's side; the user is waiting, so don't go higher.
    read-timeout: 5s
    rate-limit:
      # About one request per second from our IP, shared by every caller in this process.
      interval: 1s
      # A caller that would queue longer than this gives up (search then returns local results).
      max-wait: 10s
    retry:
      # Total attempts per request, first try included. Only 503 is retried.
      max-attempts: 3
      initial-backoff: 1s
