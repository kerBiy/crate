spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Public path /api/<x>/** -> service path /<x>/** (SPEC 5.1). Anything not listed here
          # has no route, e.g. user-service's /.well-known/jwks.json is never reachable from outside.
          # Which routes need a token is decided in SecurityConfig, not here.
          routes:
            - id: auth
              uri: ${crate.services.user-service}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: users
              uri: ${crate.services.user-service}
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: albums
              uri: ${crate.services.catalog-service}
              predicates:
                - Path=/api/albums/**
              filters:
                - StripPrefix=1
            - id: reviews
              uri: ${crate.services.review-service}
              predicates:
                - Path=/api/reviews/**
              filters:
                - StripPrefix=1

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

crate:
  # crate.services.{user-service,catalog-service,review-service}: base URLs, set per profile
  # (application-local.yml, later docker/prod). No defaults: a missing one fails startup loudly.
  gateway:
    jwt:
      # Must equal user-service's crate.auth.jwt.issuer.
      issuer: crate-user-service
      # Internal URL: the gateway fetches it, nobody outside can (it has no route).
      # Fetched on the first token, not at startup, so the gateway starts while user-service is down.
      jwk-set-uri: ${crate.services.user-service}/.well-known/jwks.json
