spring:
  application:
    name: review-service
  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB session open while the HTTP response is being written.
    open-in-view: false
  kafka:
    # bootstrap-servers is set per profile (local: localhost:29092).
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Spring Kafka 4's Jackson 3 serializer (JsonSerializer is the deprecated Jackson 2 one).
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # acks=all and enable.idempotence=true are already Kafka's producer defaults: the broker confirms
      # a write only once it's stored, and a retried send can't be written twice.
      properties:
        # No __TypeId__ header: consumers dispatch on eventType, not on our Java class names (SPEC 6.3).
        "[spring.json.add.type.headers]": false
        # send() blocks while it fetches topic metadata; with Kafka down that's 60 s by default, inside
        # an HTTP request. Fail fast instead: the review is already saved (see ADR-006).
        "[max.block.ms]": 3000

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health

crate:
  catalog:
    # catalog-service, used to check that an album exists before it's rated.
    # base-url is set per profile; startup fails without it.
    # SPEC 3.3: every service-to-service call has an explicit timeout.
    timeout: 2s
  users:
    # user-service, asked who someone follows for the feed (SPEC 5.4).
    # base-url is set per profile; startup fails without it.
    timeout: 2s
