# Local development: services on the Mac, Postgres from `make infra-up`.
spring:
  config:
    # .env is KEY=value, i.e. valid .properties; the [.properties] hint picks that loader.
    # Path is relative to the working directory (the module dir under ./gradlew bootRun).
    # Not optional: a missing .env should fail startup loudly.
    import: file:../../infra/compose/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
    username: user_service
    password: ${USERS_DB_PASSWORD}
crate:
  auth:
    jwt:
      # Created by `make jwt-keys` (git-ignored). Relative to the module dir, like the .env import.
      private-key-location: file:../../infra/compose/secrets/jwt-private.pem
